name: Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      threads:
        required: false
        type: number
        default: 50

      run_test:
        required: false
        type: boolean
        default: true

    outputs:
      test-result:
        description: "Performance test result"
        value: ${{ jobs.reusable-test.outputs.test-result }}

jobs:
  reusable-test:
    runs-on: ubuntu-latest

    outputs:
      test-result: ${{ steps.test-result.outputs.result }}

    steps:
      - name: Show test configuration
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Threads: ${{ inputs.threads }}"
          echo "Run test: ${{ inputs.run_test }}"

      - name: Generate test result
        id: test-result
        run: |
          echo "result=passed" >> "$GITHUB_OUTPUT"

      - name: Show test result
        run: |
          echo "Test result: ${{ steps.test-result.outputs.result }}"

      - name: Run performance test
        if: ${{ inputs.run_test }}
        run: |
          echo "Running performance test..."
          echo "Environment: ${{ inputs.environment }}"
          echo "Threads: ${{ inputs.threads }}"

  show-result:
    runs-on: ubuntu-latest
    needs: reusable-test

    steps:
      - name: Show job output
        run: |
          echo "Job output: ${{ needs.reusable-test.outputs.test-result }}"
