name: Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      threads:
        required: false
        type: number
        default: 50

      run_test:
        required: false
        type: boolean
        default: true

jobs:
  reusable-test:
    runs-on: ubuntu-latest

    steps:
      - name: Run reusable workflow
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Threads: ${{ inputs.threads }}"
          echo "Run test: ${{ inputs.run_test }}"
